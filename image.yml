# The manifest for docker-python. Schema: https://github.com/linuxserver-playground/builder/blob/main/schemas/image.schema.json
schema: 1
name: python
kind: tool

summary: python container image.

upstream:
  version:
    type: command
    run: |-
      echo $(curl -fsL https://raw.githubusercontent.com/home-assistant/docker/refs/heads/master/Dockerfile | grep 'ARG BUILD_FROM=' | cut -d: -f2 | sed -E 's|.*-(alpine.*)-.*|\1|' | sed 's|\.||')-$(curl -fsL https://raw.githubusercontent.com/home-assistant/docker-base/refs/heads/master/python/$(curl -fsL https://raw.githubusercontent.com/home-assistant/docker/refs/heads/master/Dockerfile | grep 'ARG BUILD_FROM=' | cut -d: -f2 | sed -E 's|([0-9\.]+)-alpine.*|\1|')/Dockerfile | grep 'ARG PYTHON_VERSION=' | sed 's|.*PYTHON_VERSION=||')
  sponsor:
  - name: PSF donations
    url: https://www.python.org/psf/donations/

release:
  branch: ha
  tag: ha
  channel: prerelease

build:
  base: alpine
  version_arg: OS_PYTHON_VERSION
  platforms:
  - amd64
  - arm64

test:
  enabled: false
  startup_timeout: 120
  env:
    TZ: US/Pacific

runtime: {}

docs:
  categories:
  - Internal
  custom_readme: |
